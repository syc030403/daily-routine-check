<!DOCTYPE html>
<!--
  데일리 루틴 체크 앱
  의도: 매일 루틴을 폰에서 바로 체크하고 한 줄 메모를 남기는 개인용 앱.
       로그인/메뉴/저장 버튼 없이 열자마자 바로 쓸 수 있어야 해서,
       빌드 도구 없이 이 파일 하나(+manifest, icon)로만 끝나게 만듦.
       체크 항목은 코드에 박아두지 않고 사용자가 처음부터 직접 추가하는 방식.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 루틴</title>
<!-- 전부 상대 경로: GitHub Pages 하위 경로(/저장소이름/)에서도 그대로 동작하도록 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴">
<style>
  :root {
    --bg: #f5f5f0;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --sub-text: #6b6b6b;
    --border: #e0e0da;
    --accent: #2e7d32;
    --done-bg: #eef3ec;
    --danger: #b3453f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --card-bg: #1f2019;
      --text: #ececec;
      --sub-text: #9a9a92;
      --border: #333428;
      --accent: #6fbf73;
      --done-bg: #262a22;
      --danger: #e08680;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .today-date {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 20px;
  }
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
  }
  .check-item.done {
    background: var(--done-bg);
    opacity: 0.6;
  }
  .check-item.done .label {
    text-decoration: line-through;
  }
  .check-item input[type="checkbox"] {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .label {
    font-size: 16px;
    flex: 1;
  }
  .delete-btn {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 18px;
    cursor: pointer;
  }
  .checklist-empty {
    color: var(--sub-text);
    font-size: 14px;
    text-align: center;
    padding: 16px 0;
  }
  .add-item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-item-row input {
    flex: 1;
    min-height: 48px;
    padding: 10px 14px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .add-item-row button {
    min-height: 48px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .memo-box {
    margin-bottom: 28px;
  }
  .memo-box input {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    font-size: 15px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .memo-box input::placeholder {
    color: var(--sub-text);
  }
  .history-title {
    font-size: 14px;
    color: var(--sub-text);
    margin: 0 0 10px;
  }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    padding: 10px 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--sub-text);
  }
  .history-memo {
    margin-top: 4px;
    font-size: 14px;
  }
  .history-empty {
    color: var(--sub-text);
    font-size: 14px;
    text-align: center;
    padding: 12px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="today-date" id="todayDate"></div>
  <div class="checklist" id="checklist"></div>
  <form class="add-item-row" id="addItemForm">
    <input type="text" id="newItemInput" placeholder="새 루틴 항목 추가">
    <button type="submit">추가</button>
  </form>
  <div class="memo-box">
    <input type="text" id="memoInput" placeholder="오늘 기억나는 문장">
  </div>
  <div class="history-title">지난 기록</div>
  <div class="history-list" id="historyList"></div>
</div>

<script>
// 체크 항목은 코드에 미리 넣지 않고, 사용자가 처음 실행할 때부터 직접 추가해서 채움
const STORAGE_KEY = "routine-log";

// 기기 로컬 시간 기준 YYYY-MM-DD
function getTodayKey() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function getWeekdayLabel(dateKey) {
  const names = ["일", "월", "화", "수", "목", "금", "토"];
  const d = new Date(dateKey + "T00:00:00");
  return names[d.getDay()];
}

// localStorage 읽기/쓰기: 개인용 로컬 저장이 목적이라 서버/동기화 없이 이것만으로 충분.
// 시크릿 모드 등에서 저장이 막혀도 앱이 죽지 않도록 try/catch로 감쌈.
// items(항목 목록)와 날짜별 기록을 한 객체에 같이 담아서 키 하나로 관리
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if (!Array.isArray(parsed.items)) parsed.items = [];
    return parsed;
  } catch (e) {
    return { items: [] };
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // 저장 실패해도 무시하고 화면은 계속 동작
  }
}

const todayKey = getTodayKey();
let data = loadData();

if (!data[todayKey]) {
  data[todayKey] = { checks: {}, memo: "" };
}

// 오늘 기록에 현재 항목 전부를 반영(새로 추가된 항목은 체크 안 됨 상태로 등록)
// 이렇게 해야 지난 기록에서 그날의 "완료 개수/전체 개수"를 정확히 셀 수 있음
function syncTodayChecks() {
  data.items.forEach((item) => {
    if (!(item in data[todayKey].checks)) {
      data[todayKey].checks[item] = false;
    }
  });
}
syncTodayChecks();

// 오늘 날짜 표시
document.getElementById("todayDate").textContent =
  todayKey + " (" + getWeekdayLabel(todayKey) + ")";

// 체크리스트 렌더링
const checklistEl = document.getElementById("checklist");

function renderChecklist() {
  checklistEl.innerHTML = "";

  if (data.items.length === 0) {
    checklistEl.innerHTML = '<div class="checklist-empty">아래에서 루틴 항목을 추가해보세요</div>';
    return;
  }

  data.items.forEach((item) => {
    const checked = !!data[todayKey].checks[item];
    const row = document.createElement("div");
    row.className = "check-item" + (checked ? " done" : "");

    const label = document.createElement("label");
    label.style.display = "flex";
    label.style.alignItems = "center";
    label.style.gap = "12px";
    label.style.flex = "1";
    label.style.cursor = "pointer";

    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = checked;
    input.addEventListener("change", () => {
      data[todayKey].checks[item] = input.checked;
      saveData(data);
      renderChecklist();
    });

    const span = document.createElement("span");
    span.className = "label";
    span.textContent = item;

    label.appendChild(input);
    label.appendChild(span);

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "×";
    deleteBtn.setAttribute("aria-label", item + " 삭제");
    deleteBtn.addEventListener("click", () => {
      data.items = data.items.filter((i) => i !== item);
      saveData(data);
      renderChecklist();
    });

    row.appendChild(label);
    row.appendChild(deleteBtn);
    checklistEl.appendChild(row);
  });
}

renderChecklist();

// 새 항목 추가
const addItemForm = document.getElementById("addItemForm");
const newItemInput = document.getElementById("newItemInput");

addItemForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = newItemInput.value.trim();
  if (!name || data.items.includes(name)) {
    newItemInput.value = "";
    return;
  }
  data.items.push(name);
  data[todayKey].checks[name] = false;
  saveData(data);
  newItemInput.value = "";
  renderChecklist();
});

// 한 줄 메모: 입력할 때마다 바로 저장하면 과도하니, 타이핑 멈추고 0.4초 후에 저장
const memoInput = document.getElementById("memoInput");
memoInput.value = data[todayKey].memo || "";

let memoTimer = null;
memoInput.addEventListener("input", () => {
  clearTimeout(memoTimer);
  memoTimer = setTimeout(() => {
    data[todayKey].memo = memoInput.value;
    saveData(data);
  }, 400);
});

// 지난 기록 (오늘 제외, 최근 날짜부터). 날짜 형식인 키만 기록으로 취급 (items, goals 등 제외)
function renderHistory() {
  const historyEl = document.getElementById("historyList");
  const dates = Object.keys(data)
    .filter((key) => /^\d{4}-\d{2}-\d{2}$/.test(key) && key !== todayKey)
    .sort((a, b) => (a < b ? 1 : -1));

  if (dates.length === 0) {
    historyEl.innerHTML = '<div class="history-empty">아직 지난 기록이 없습니다</div>';
    return;
  }

  historyEl.innerHTML = "";
  dates.forEach((dateKey) => {
    const entry = data[dateKey];
    const checks = entry.checks || {};
    const total = Object.keys(checks).length;
    const doneCount = Object.values(checks).filter(Boolean).length;

    const item = document.createElement("div");
    item.className = "history-item";

    const row = document.createElement("div");
    row.className = "history-row";
    row.innerHTML =
      "<span>" + dateKey + " (" + getWeekdayLabel(dateKey) + ")</span>" +
      "<span>" + doneCount + "/" + total + "</span>";
    item.appendChild(row);

    if (entry.memo) {
      const memoEl = document.createElement("div");
      memoEl.className = "history-memo";
      memoEl.textContent = entry.memo;
      item.appendChild(memoEl);
    }

    historyEl.appendChild(item);
  });
}

renderHistory();
</script>
</body>
</html>
