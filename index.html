<!DOCTYPE html>
<!--
  데일리 루틴 체크 앱
  의도: 달력으로 날짜별 루틴을 관리하고, 옆으로 넘기면 오늘 루틴을 바로 체크하는 개인용 앱.
       로그인/메뉴/저장 버튼 없이 바로 쓸 수 있어야 해서,
       빌드 도구 없이 이 파일 하나(+manifest, icon)로만 끝나게 만듦.
       체크 항목은 코드에 박아두지 않고 사용자가 처음부터 직접 추가하는 방식.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 루틴</title>
<!-- 전부 상대 경로: GitHub Pages 하위 경로(/저장소이름/)에서도 그대로 동작하도록 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴">
<style>
  :root {
    --bg: #f5f5f0;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --sub-text: #6b6b6b;
    --border: #e0e0da;
    --accent: #2e7d32;
    --on-accent: #ffffff;
    --done-bg: #eef3ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --card-bg: #1f2019;
      --text: #ececec;
      --sub-text: #9a9a92;
      --border: #333428;
      --accent: #6fbf73;
      --on-accent: #14150f;
      --done-bg: #262a22;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button { font-family: inherit; color: inherit; }

  /* 달력/오늘 두 화면을 가로로 놓고, 브라우저 기본 스크롤로 넘김 */
  .pager {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .pager::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%;
    min-width: 0;
    overflow-y: auto;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .tabs {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    min-height: 48px;
    font-size: 14px;
    color: var(--sub-text);
    background: none;
    border: none;
    cursor: pointer;
  }
  .tab.active {
    color: var(--text);
    font-weight: 700;
  }

  /* 달력 */
  .month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
  }
  .month-btn {
    width: 48px;
    height: 48px;
    font-size: 20px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .weekday {
    padding: 6px 0;
    font-size: 12px;
    text-align: center;
    color: var(--sub-text);
  }
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-height: 56px;
    padding: 6px 0;
    font-size: 15px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .day-cell.today {
    border: 2px solid var(--accent);
    font-weight: 700;
  }
  .day-cell.all-done {
    background: var(--accent);
    color: var(--on-accent);
  }
  .day-count {
    font-size: 11px;
    font-weight: 400;
  }

  /* 날짜별 루틴 화면 */
  .day-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 20px;
  }
  .day-detail {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  .back-btn {
    min-height: 48px;
    padding: 0 8px 0 0;
    font-size: 15px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .add-item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-item-row input {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 10px 14px;
    font-size: 16px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .add-item-row button {
    min-height: 48px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 48px;
    padding: 0 8px 0 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .check-item.done {
    background: var(--done-bg);
    opacity: 0.6;
  }
  .check-item.done .label {
    text-decoration: line-through;
  }
  .check-label {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    min-height: 48px;
    cursor: pointer;
    user-select: none;
  }
  .check-label input {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .label {
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .delete-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 18px;
    cursor: pointer;
  }
  .checklist-empty {
    color: var(--sub-text);
    font-size: 14px;
    text-align: center;
    padding: 16px 0;
  }
  .memo-input {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    font-size: 16px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .memo-input::placeholder,
  .add-item-row input::placeholder {
    color: var(--sub-text);
  }
</style>
</head>
<body>
<main class="pager" id="pager">
  <section class="page" aria-label="달력">
    <div class="wrap">
      <div class="month-header">
        <button type="button" class="month-btn" id="prevMonth" aria-label="이전 달">‹</button>
        <h1 class="month-title" id="monthTitle"></h1>
        <button type="button" class="month-btn" id="nextMonth" aria-label="다음 달">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>
  <section class="page" aria-label="오늘 루틴">
    <div class="wrap" id="todayView"></div>
  </section>
</main>
<nav class="tabs">
  <button type="button" class="tab active" id="calendarTab">달력</button>
  <button type="button" class="tab" id="todayTab">오늘</button>
</nav>
<div class="day-detail" id="dayDetail" hidden>
  <div class="wrap">
    <button type="button" class="back-btn" id="backBtn">‹ 달력</button>
    <div id="detailView"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "routine-log";
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

// 기기 로컬 시간 기준 YYYY-MM-DD
function toDateKey(y, monthIndex, day) {
  return y + "-" + String(monthIndex + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function getWeekdayLabel(dateKey) {
  return WEEKDAYS[new Date(dateKey + "T00:00:00").getDay()];
}

// localStorage 읽기/쓰기: 개인용 로컬 저장이 목적이라 서버/동기화 없이 이것만으로 충분.
// 시크릿 모드 등에서 저장이 막혀도 앱이 죽지 않도록 try/catch로 감쌈.
// items(기본 루틴)와 날짜별 기록을 한 객체에 같이 담아서 키 하나로 관리
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if (!Array.isArray(parsed.items)) parsed.items = [];
    return parsed;
  } catch (e) {
    return { items: [] };
  }
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // 저장 실패해도 무시하고 화면은 계속 동작
  }
}

const now = new Date();
const todayKey = toDateKey(now.getFullYear(), now.getMonth(), now.getDate());
const data = loadData();

// 그 날의 루틴 목록 = 그 날 기록의 checks 키. 기록이 없는 날은 기본 루틴을 보여줌
function getEntry(dateKey) {
  if (!data[dateKey]) {
    const checks = {};
    data.items.forEach((item) => { checks[item] = false; });
    data[dateKey] = { checks: checks, memo: "" };
  }
  if (!data[dateKey].checks) data[dateKey].checks = {};
  return data[dateKey];
}

function getRoutines(dateKey) {
  return data[dateKey] ? Object.keys(data[dateKey].checks || {}) : data.items;
}

// 오늘 기록을 미리 만들어 둬야 달력의 완료 개수가 그날 기준으로 정확함
getEntry(todayKey);

// 달력
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
const calendarGrid = document.getElementById("calendarGrid");

function renderCalendar() {
  document.getElementById("monthTitle").textContent = viewYear + "년 " + (viewMonth + 1) + "월";
  calendarGrid.innerHTML = "";

  WEEKDAYS.forEach((name) => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = name;
    calendarGrid.appendChild(el);
  });

  // 1일이 시작하는 요일만큼 빈 칸을 넣어 맞춤
  const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
  for (let i = 0; i < firstWeekday; i++) {
    calendarGrid.appendChild(document.createElement("div"));
  }

  const lastDay = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let day = 1; day <= lastDay; day++) {
    const dateKey = toDateKey(viewYear, viewMonth, day);
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "day-cell" + (dateKey === todayKey ? " today" : "");
    cell.textContent = day;

    let ariaLabel = dateKey + " " + getWeekdayLabel(dateKey) + "요일";
    const checks = data[dateKey] && data[dateKey].checks;
    const total = checks ? Object.keys(checks).length : 0;
    if (total > 0) {
      const doneCount = Object.values(checks).filter(Boolean).length;
      const countEl = document.createElement("span");
      countEl.className = "day-count";
      countEl.textContent = doneCount + "/" + total;
      cell.appendChild(countEl);
      ariaLabel += ", " + total + "개 중 " + doneCount + "개 완료";
      if (doneCount === total) cell.classList.add("all-done");
    }
    cell.setAttribute("aria-label", ariaLabel);

    cell.addEventListener("click", () => {
      if (dateKey === todayKey) goToPage(1);
      else openDayDetail(dateKey);
    });
    calendarGrid.appendChild(cell);
  }
}

function moveMonth(diff) {
  const d = new Date(viewYear, viewMonth + diff, 1);
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  renderCalendar();
}
document.getElementById("prevMonth").addEventListener("click", () => moveMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => moveMonth(1));

// 날짜별 루틴 화면: 오늘 화면과 달력에서 연 날짜 화면이 같은 코드를 씀
let memoTimer = null;

function renderDayView(root, dateKey) {
  root.innerHTML = "";

  function refresh() {
    saveData();
    renderDayView(root, dateKey);
    renderCalendar();
  }

  const title = document.createElement("h2");
  title.className = "day-title";
  title.textContent = dateKey + " (" + getWeekdayLabel(dateKey) + ")";
  root.appendChild(title);

  // 추가 입력창
  const form = document.createElement("form");
  form.className = "add-item-row";
  const newItemInput = document.createElement("input");
  newItemInput.type = "text";
  newItemInput.placeholder = "새 루틴 항목 추가";
  newItemInput.setAttribute("aria-label", "새 루틴 항목");
  const addBtn = document.createElement("button");
  addBtn.type = "submit";
  addBtn.textContent = "추가";
  form.appendChild(newItemInput);
  form.appendChild(addBtn);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = newItemInput.value.trim();
    newItemInput.value = "";
    if (!name || getRoutines(dateKey).includes(name)) return;
    getEntry(dateKey).checks[name] = false;
    // 오늘 화면에서 고친 내용만 기본 루틴에 반영해서 다음 날부터 이어짐
    if (dateKey === todayKey && !data.items.includes(name)) data.items.push(name);
    refresh();
    root.querySelector(".add-item-row input").focus();
  });
  root.appendChild(form);

  // 체크리스트
  const list = document.createElement("div");
  list.className = "checklist";
  const routines = getRoutines(dateKey);
  if (routines.length === 0) {
    const empty = document.createElement("div");
    empty.className = "checklist-empty";
    empty.textContent = "위에서 루틴 항목을 추가해보세요";
    list.appendChild(empty);
  }
  routines.forEach((item) => {
    const checked = !!(data[dateKey] && data[dateKey].checks[item]);
    const row = document.createElement("div");
    row.className = "check-item" + (checked ? " done" : "");

    const label = document.createElement("label");
    label.className = "check-label";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = checked;
    input.addEventListener("change", () => {
      getEntry(dateKey).checks[item] = input.checked;
      refresh();
    });
    const span = document.createElement("span");
    span.className = "label";
    span.textContent = item;
    label.appendChild(input);
    label.appendChild(span);

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "×";
    deleteBtn.setAttribute("aria-label", item + " 삭제");
    deleteBtn.addEventListener("click", () => {
      delete getEntry(dateKey).checks[item];
      if (dateKey === todayKey) data.items = data.items.filter((i) => i !== item);
      refresh();
    });

    row.appendChild(label);
    row.appendChild(deleteBtn);
    list.appendChild(row);
  });
  root.appendChild(list);

  // 한 줄 메모: 값은 바로 반영하고, 저장만 타이핑이 멈춘 뒤 0.4초 후에 함
  const memoInput = document.createElement("input");
  memoInput.type = "text";
  memoInput.className = "memo-input";
  memoInput.placeholder = dateKey === todayKey ? "오늘 기억나는 문장" : "이 날 기억나는 문장";
  memoInput.setAttribute("aria-label", "한 줄 메모");
  memoInput.value = (data[dateKey] && data[dateKey].memo) || "";
  memoInput.addEventListener("input", () => {
    getEntry(dateKey).memo = memoInput.value;
    clearTimeout(memoTimer);
    memoTimer = setTimeout(saveData, 400);
  });
  root.appendChild(memoInput);
}

// 달력에서 오늘이 아닌 날짜를 눌렀을 때 뜨는 화면
const dayDetail = document.getElementById("dayDetail");

function openDayDetail(dateKey) {
  renderDayView(document.getElementById("detailView"), dateKey);
  dayDetail.hidden = false;
  dayDetail.scrollTop = 0;
}

document.getElementById("backBtn").addEventListener("click", () => {
  dayDetail.hidden = true;
});

// 화면 넘기기: 스와이프는 브라우저가 처리하고, 탭은 터치 없는 환경에서도 넘길 수 있게 함
const pager = document.getElementById("pager");
const calendarTab = document.getElementById("calendarTab");
const todayTab = document.getElementById("todayTab");

function goToPage(index) {
  pager.scrollTo({ left: pager.clientWidth * index });
}

calendarTab.addEventListener("click", () => goToPage(0));
todayTab.addEventListener("click", () => goToPage(1));
pager.addEventListener("scroll", () => {
  const onToday = pager.scrollLeft > pager.clientWidth / 2;
  todayTab.classList.toggle("active", onToday);
  calendarTab.classList.toggle("active", !onToday);
});

renderCalendar();
renderDayView(document.getElementById("todayView"), todayKey);
</script>
</body>
</html>
