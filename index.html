<!DOCTYPE html>
<!--
  데일리 루틴 체크 앱
  의도: 달력으로 날짜별 루틴을 관리하고, 옆으로 넘기면 오늘 루틴을 바로 체크하는 개인용 앱.
       메뉴/저장 버튼 없이 바로 쓸 수 있어야 해서,
       빌드 도구 없이 이 파일 하나(+manifest, icon)로만 끝나게 만듦.
       로그인은 선택: 안 하면 이 기기에만 저장되고, 구글 로그인하면 폰과 웹이 동기화됨.
       체크 항목은 코드에 박아두지 않고 사용자가 처음부터 직접 추가하는 방식.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 루틴</title>
<!-- 전부 상대 경로: GitHub Pages 하위 경로(/저장소이름/)에서도 그대로 동작하도록 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴">
<style>
  :root {
    --bg: #f5f5f0;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --sub-text: #6b6b6b;
    --border: #e0e0da;
    --accent: #2e7d32;
    --on-accent: #ffffff;
    --done-bg: #eef3ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14150f;
      --card-bg: #1f2019;
      --text: #ececec;
      --sub-text: #9a9a92;
      --border: #333428;
      --accent: #6fbf73;
      --on-accent: #14150f;
      --done-bg: #262a22;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  button { font-family: inherit; color: inherit; }

  /* 달력/오늘 두 화면을 가로로 놓고, 브라우저 기본 스크롤로 넘김 */
  .pager {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }
  .pager::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%;
    min-width: 0;
    overflow-y: auto;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
  }
  .tabs {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--card-bg);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1;
    min-height: 48px;
    font-size: 14px;
    color: var(--sub-text);
    background: none;
    border: none;
    cursor: pointer;
  }
  .tab.active {
    color: var(--text);
    font-weight: 700;
  }

  /* 달력 */
  .month-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .month-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
  }
  .month-btn {
    width: 48px;
    height: 48px;
    font-size: 20px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .weekday {
    padding: 6px 0;
    font-size: 12px;
    text-align: center;
    color: var(--sub-text);
  }
  .day-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-height: 56px;
    padding: 6px 0;
    font-size: 15px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .day-cell.today {
    border: 2px solid var(--accent);
    font-weight: 700;
  }
  .day-cell.all-done {
    background: var(--accent);
    color: var(--on-accent);
  }
  .day-count {
    font-size: 11px;
    font-weight: 400;
  }

  /* 날짜별 루틴 화면 */
  .day-title {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin: 8px 0 20px;
  }
  .day-detail {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow-y: auto;
    background: var(--bg);
  }
  .back-btn {
    min-height: 48px;
    padding: 0 8px 0 0;
    font-size: 15px;
    background: none;
    border: none;
    cursor: pointer;
  }
  .add-item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-item-row input {
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 10px 14px;
    font-size: 16px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .add-item-row button {
    min-height: 48px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .checklist {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .check-item {
    padding: 0 8px 0 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .check-item.done {
    background: var(--done-bg);
    opacity: 0.6;
  }
  .check-main,
  .sub-item {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .check-item.done .check-main .label,
  .sub-item.done .label {
    text-decoration: line-through;
  }
  .sub-item.done .label {
    color: var(--sub-text);
  }
  /* 세부 루틴: 체크박스 너비만큼 들여써서 루틴 아래에 붙임 */
  .sub-list {
    margin-left: 34px;
    padding-bottom: 10px;
  }
  .sub-toggle {
    min-width: 44px;
    min-height: 44px;
    flex-shrink: 0;
    padding: 0 4px;
    font-size: 16px;
    color: var(--sub-text);
    background: none;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }
  .sub-add {
    display: flex;
    gap: 8px;
    margin-right: 6px;
  }
  .sub-add input {
    flex: 1;
    min-width: 0;
    min-height: 44px;
    padding: 8px 10px;
    font-size: 16px;
    background: transparent;
    color: var(--text);
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .sub-add input::placeholder {
    color: var(--sub-text);
  }
  .sub-add button {
    width: 44px;
    min-height: 44px;
    flex-shrink: 0;
    font-size: 20px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .check-label {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
    min-height: 48px;
    padding: 6px 0;
    cursor: pointer;
    user-select: none;
  }
  .check-label input {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    accent-color: var(--accent);
  }
  .label {
    font-size: 16px;
    overflow-wrap: anywhere;
  }
  .delete-btn {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border: none;
    background: none;
    color: var(--sub-text);
    font-size: 18px;
    cursor: pointer;
  }
  .checklist-empty {
    color: var(--sub-text);
    font-size: 14px;
    text-align: center;
    padding: 16px 0;
  }
  .memo-input {
    width: 100%;
    min-height: 48px;
    padding: 12px 14px;
    font-size: 16px;
    background: var(--card-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .memo-input::placeholder,
  .add-item-row input::placeholder {
    color: var(--sub-text);
  }

  /* 로그인/동기화 상태 */
  .account-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--sub-text);
  }
  .account-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .account-btn {
    min-height: 48px;
    flex-shrink: 0;
    padding: 0 14px;
    font-size: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
</style>
</head>
<body>
<main class="pager" id="pager">
  <section class="page" aria-label="달력">
    <div class="wrap">
      <div class="month-header">
        <button type="button" class="month-btn" id="prevMonth" aria-label="이전 달">‹</button>
        <h1 class="month-title" id="monthTitle"></h1>
        <button type="button" class="month-btn" id="nextMonth" aria-label="다음 달">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="account-bar">
        <span class="account-text" id="accountText">이 기기에만 저장 중</span>
        <button type="button" class="account-btn" id="accountBtn" hidden>구글 로그인</button>
      </div>
    </div>
  </section>
  <section class="page" aria-label="오늘 루틴">
    <div class="wrap" id="todayView"></div>
  </section>
</main>
<nav class="tabs">
  <button type="button" class="tab active" id="calendarTab">달력</button>
  <button type="button" class="tab" id="todayTab">오늘</button>
</nav>
<div class="day-detail" id="dayDetail" hidden>
  <div class="wrap">
    <button type="button" class="back-btn" id="backBtn">‹ 달력</button>
    <div id="detailView"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "routine-log";
// 로그인 전에는 null이라 pushChanges가 아무것도 안 함. 저장이 시작 직후에도 불릴 수 있어 맨 위에 둠
let userPath = null;
const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

// 기기 로컬 시간 기준 YYYY-MM-DD
function toDateKey(y, monthIndex, day) {
  return y + "-" + String(monthIndex + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
}

function getWeekdayLabel(dateKey) {
  return WEEKDAYS[new Date(dateKey + "T00:00:00").getDay()];
}

// localStorage 읽기/쓰기: 로그인 전 저장소이자, 로그인 후에도 화면을 바로 띄우기 위한 사본.
// 시크릿 모드 등에서 저장이 막혀도 앱이 죽지 않도록 try/catch로 감쌈.
// items(기본 루틴), subItems(기본 세부 루틴), 날짜별 기록을 한 객체에 같이 담아서 키 하나로 관리
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    if (!Array.isArray(parsed.items)) parsed.items = [];
    if (!parsed.subItems) parsed.subItems = {};
    return parsed;
  } catch (e) {
    return { items: [], subItems: {} };
  }
}

function saveLocalOnly() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    // 저장 실패해도 무시하고 화면은 계속 동작
  }
}

function saveData() {
  saveLocalOnly();
  pushChanges();
}

const now = new Date();
const todayKey = toDateKey(now.getFullYear(), now.getMonth(), now.getDate());
const data = loadData();

// 없앤 세부 목표 기능의 저장 내용을 기기에서 완전히 지움
if ("goals" in data) {
  delete data.goals;
  saveData();
}

// 그 날의 루틴 목록 = 그 날 기록의 checks 키. 기록이 없는 날은 기본 루틴을 보여줌
function createDefaultEntry() {
  const checks = {};
  const subs = {};
  data.items.forEach((item) => {
    checks[item] = false;
    subs[item] = {};
    (data.subItems[item] || []).forEach((sub) => { subs[item][sub] = false; });
  });
  return { checks: checks, subs: subs, memo: "" };
}

function getEntry(dateKey) {
  if (!data[dateKey]) data[dateKey] = createDefaultEntry();
  if (!data[dateKey].checks) data[dateKey].checks = {};
  if (!data[dateKey].subs) data[dateKey].subs = {};
  return data[dateKey];
}

function getRoutines(dateKey) {
  return data[dateKey] ? Object.keys(data[dateKey].checks || {}) : data.items;
}

function getSubs(dateKey, item) {
  if (!data[dateKey]) return data.subItems[item] || [];
  return Object.keys((data[dateKey].subs || {})[item] || {});
}

// 오늘 기록을 미리 만들어 둬야 달력의 완료 개수가 그날 기준으로 정확함
getEntry(todayKey);

// 달력
let viewYear = now.getFullYear();
let viewMonth = now.getMonth();
const calendarGrid = document.getElementById("calendarGrid");

function renderCalendar() {
  document.getElementById("monthTitle").textContent = viewYear + "년 " + (viewMonth + 1) + "월";
  calendarGrid.innerHTML = "";

  WEEKDAYS.forEach((name) => {
    const el = document.createElement("div");
    el.className = "weekday";
    el.textContent = name;
    calendarGrid.appendChild(el);
  });

  // 1일이 시작하는 요일만큼 빈 칸을 넣어 맞춤
  const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
  for (let i = 0; i < firstWeekday; i++) {
    calendarGrid.appendChild(document.createElement("div"));
  }

  const lastDay = new Date(viewYear, viewMonth + 1, 0).getDate();
  for (let day = 1; day <= lastDay; day++) {
    const dateKey = toDateKey(viewYear, viewMonth, day);
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "day-cell" + (dateKey === todayKey ? " today" : "");
    cell.textContent = day;

    let ariaLabel = dateKey + " " + getWeekdayLabel(dateKey) + "요일";
    const checks = data[dateKey] && data[dateKey].checks;
    const total = checks ? Object.keys(checks).length : 0;
    if (total > 0) {
      const doneCount = Object.values(checks).filter(Boolean).length;
      const countEl = document.createElement("span");
      countEl.className = "day-count";
      countEl.textContent = doneCount + "/" + total;
      cell.appendChild(countEl);
      ariaLabel += ", " + total + "개 중 " + doneCount + "개 완료";
      if (doneCount === total) cell.classList.add("all-done");
    }
    cell.setAttribute("aria-label", ariaLabel);

    cell.addEventListener("click", () => {
      if (dateKey === todayKey) goToPage(1);
      else openDayDetail(dateKey);
    });
    calendarGrid.appendChild(cell);
  }
}

function moveMonth(diff) {
  const d = new Date(viewYear, viewMonth + diff, 1);
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
  renderCalendar();
}
document.getElementById("prevMonth").addEventListener("click", () => moveMonth(-1));
document.getElementById("nextMonth").addEventListener("click", () => moveMonth(1));

// 날짜별 루틴 화면: 오늘 화면과 달력에서 연 날짜 화면이 같은 코드를 씀
let memoTimer = null;

// 펼쳐 둔 루틴. 앱을 다시 열면 전부 접힌 상태로 시작하도록 저장하지 않음
const expandedRoutines = new Set();

function renderDayView(root, dateKey) {
  root.innerHTML = "";

  function refresh() {
    saveData();
    renderDayView(root, dateKey);
    renderCalendar();
  }

  const title = document.createElement("h2");
  title.className = "day-title";
  title.textContent = dateKey + " (" + getWeekdayLabel(dateKey) + ")";
  root.appendChild(title);

  // 추가 입력창
  const form = document.createElement("form");
  form.className = "add-item-row";
  const newItemInput = document.createElement("input");
  newItemInput.type = "text";
  newItemInput.placeholder = "새 루틴 항목 추가";
  newItemInput.setAttribute("aria-label", "새 루틴 항목");
  const addBtn = document.createElement("button");
  addBtn.type = "submit";
  addBtn.textContent = "추가";
  form.appendChild(newItemInput);
  form.appendChild(addBtn);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = newItemInput.value.trim();
    newItemInput.value = "";
    if (!name || getRoutines(dateKey).includes(name)) return;
    getEntry(dateKey).checks[name] = false;
    // 오늘 화면에서 고친 내용만 기본 루틴에 반영해서 다음 날부터 이어짐
    if (dateKey === todayKey && !data.items.includes(name)) data.items.push(name);
    refresh();
    root.querySelector(".add-item-row input").focus();
  });
  root.appendChild(form);

  // 체크리스트
  const list = document.createElement("div");
  list.className = "checklist";
  const routines = getRoutines(dateKey);
  if (routines.length === 0) {
    const empty = document.createElement("div");
    empty.className = "checklist-empty";
    empty.textContent = "위에서 루틴 항목을 추가해보세요";
    list.appendChild(empty);
  }
  routines.forEach((item, routineIndex) => {
    const checked = !!(data[dateKey] && data[dateKey].checks[item]);
    const row = document.createElement("div");
    row.className = "check-item" + (checked ? " done" : "");

    const main = document.createElement("div");
    main.className = "check-main";

    const label = document.createElement("label");
    label.className = "check-label";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = checked;
    input.addEventListener("change", () => {
      getEntry(dateKey).checks[item] = input.checked;
      refresh();
    });
    const span = document.createElement("span");
    span.className = "label";
    span.textContent = item;
    label.appendChild(input);
    label.appendChild(span);

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "delete-btn";
    deleteBtn.textContent = "×";
    deleteBtn.setAttribute("aria-label", item + " 삭제");
    deleteBtn.addEventListener("click", () => {
      const entry = getEntry(dateKey);
      delete entry.checks[item];
      delete entry.subs[item];
      if (dateKey === todayKey) {
        data.items = data.items.filter((i) => i !== item);
        delete data.subItems[item];
      }
      refresh();
    });

    main.appendChild(label);
    main.appendChild(deleteBtn);
    row.appendChild(main);

    // 세부 루틴: 루틴과 같은 규칙으로 오늘 화면에서 고친 내용만 다음 날로 이어짐
    const subList = document.createElement("div");
    subList.className = "sub-list";
    const subs = getSubs(dateKey, item);
    let subDoneCount = 0;
    subs.forEach((sub) => {
      const subChecked = !!(data[dateKey] && data[dateKey].subs && data[dateKey].subs[item][sub]);
      if (subChecked) subDoneCount++;
      const subRow = document.createElement("div");
      subRow.className = "sub-item" + (subChecked ? " done" : "");

      const subLabel = document.createElement("label");
      subLabel.className = "check-label";
      const subInput = document.createElement("input");
      subInput.type = "checkbox";
      subInput.checked = subChecked;
      subInput.addEventListener("change", () => {
        getEntry(dateKey).subs[item][sub] = subInput.checked;
        refresh();
      });
      const subSpan = document.createElement("span");
      subSpan.className = "label";
      subSpan.textContent = sub;
      subLabel.appendChild(subInput);
      subLabel.appendChild(subSpan);

      const subDeleteBtn = document.createElement("button");
      subDeleteBtn.type = "button";
      subDeleteBtn.className = "delete-btn";
      subDeleteBtn.textContent = "×";
      subDeleteBtn.setAttribute("aria-label", sub + " 삭제");
      subDeleteBtn.addEventListener("click", () => {
        delete getEntry(dateKey).subs[item][sub];
        if (dateKey === todayKey && data.subItems[item]) {
          data.subItems[item] = data.subItems[item].filter((s) => s !== sub);
        }
        refresh();
      });

      subRow.appendChild(subLabel);
      subRow.appendChild(subDeleteBtn);
      subList.appendChild(subRow);
    });

    const subForm = document.createElement("form");
    subForm.className = "sub-add";
    const newSubInput = document.createElement("input");
    newSubInput.type = "text";
    newSubInput.placeholder = "세부 루틴 추가";
    newSubInput.setAttribute("aria-label", item + " 세부 루틴 추가");
    const subAddBtn = document.createElement("button");
    subAddBtn.type = "submit";
    subAddBtn.textContent = "+";
    subAddBtn.setAttribute("aria-label", item + "에 세부 루틴 추가");
    subForm.appendChild(newSubInput);
    subForm.appendChild(subAddBtn);
    subForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = newSubInput.value.trim();
      newSubInput.value = "";
      if (!name || getSubs(dateKey, item).includes(name)) return;
      const entry = getEntry(dateKey);
      if (!entry.subs[item]) entry.subs[item] = {};
      entry.subs[item][name] = false;
      if (dateKey === todayKey && data.items.includes(item)) {
        if (!data.subItems[item]) data.subItems[item] = [];
        data.subItems[item].push(name);
      }
      refresh();
      root.querySelectorAll(".sub-add input")[routineIndex].focus();
    });
    subList.appendChild(subForm);

    // 펼치기 버튼: 접혀 있어도 세부 루틴 진행 상황이 보이도록 개수를 같이 표시
    const expandKey = dateKey + "\n" + item;
    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "sub-toggle";
    const countText = subs.length > 0 ? subDoneCount + "/" + subs.length + " " : "";
    function applyExpanded() {
      const expanded = expandedRoutines.has(expandKey);
      subList.hidden = !expanded;
      toggleBtn.textContent = countText + (expanded ? "▴" : "▾");
      toggleBtn.setAttribute("aria-expanded", String(expanded));
      toggleBtn.setAttribute("aria-label", item + " 세부 루틴 " + (expanded ? "접기" : "펼치기"));
    }
    toggleBtn.addEventListener("click", () => {
      if (expandedRoutines.has(expandKey)) expandedRoutines.delete(expandKey);
      else expandedRoutines.add(expandKey);
      applyExpanded();
    });
    applyExpanded();
    main.insertBefore(toggleBtn, deleteBtn);

    row.appendChild(subList);
    list.appendChild(row);
  });
  root.appendChild(list);

  // 한 줄 메모: 값은 바로 반영하고, 저장만 타이핑이 멈춘 뒤 0.4초 후에 함
  const memoInput = document.createElement("input");
  memoInput.type = "text";
  memoInput.className = "memo-input";
  memoInput.placeholder = dateKey === todayKey ? "오늘 기억나는 문장" : "이 날 기억나는 문장";
  memoInput.setAttribute("aria-label", "한 줄 메모");
  memoInput.value = (data[dateKey] && data[dateKey].memo) || "";
  memoInput.addEventListener("input", () => {
    getEntry(dateKey).memo = memoInput.value;
    clearTimeout(memoTimer);
    memoTimer = setTimeout(saveData, 400);
  });
  root.appendChild(memoInput);
}

// 달력에서 오늘이 아닌 날짜를 눌렀을 때 뜨는 화면
const dayDetail = document.getElementById("dayDetail");
let detailDateKey = null;

function openDayDetail(dateKey) {
  detailDateKey = dateKey;
  renderDayView(document.getElementById("detailView"), dateKey);
  dayDetail.hidden = false;
  dayDetail.scrollTop = 0;
}

document.getElementById("backBtn").addEventListener("click", () => {
  dayDetail.hidden = true;
});

// 화면 넘기기: 스와이프는 브라우저가 처리하고, 탭은 터치 없는 환경에서도 넘길 수 있게 함
const pager = document.getElementById("pager");
const calendarTab = document.getElementById("calendarTab");
const todayTab = document.getElementById("todayTab");

function goToPage(index) {
  pager.scrollTo({ left: pager.clientWidth * index });
}

calendarTab.addEventListener("click", () => goToPage(0));
todayTab.addEventListener("click", () => goToPage(1));
pager.addEventListener("scroll", () => {
  const onToday = pager.scrollLeft > pager.clientWidth / 2;
  todayTab.classList.toggle("active", onToday);
  calendarTab.classList.toggle("active", !onToday);
});

renderCalendar();
renderDayView(document.getElementById("todayView"), todayKey);

// 동기화: 로그인하면 날짜별 문서와 기본 루틴 문서를 Firestore에 두고 기기끼리 맞춤.
// firebaseConfig는 웹앱에 원래 공개되는 값이고, 데이터 보호는 Firestore 규칙(본인 uid만 접근)이 맡음.
const firebaseConfig = {
  apiKey: "AIzaSyBH0Ie8mpOK8x1FpZP3JN_PetH0BdzzEoI",
  authDomain: "daily-routine-check-d937d.firebaseapp.com",
  projectId: "daily-routine-check-d937d",
  storageBucket: "daily-routine-check-d937d.firebasestorage.app",
  messagingSenderId: "274845582974",
  appId: "1:274845582974:web:c976adb3234feb36627a2f"
};
const SDK_URL = "https://www.gstatic.com/firebasejs/13.2.0/";
const SYNC_UID_KEY = "routine-sync-uid";
const DATE_KEY_PATTERN = /^\d{4}-\d{2}-\d{2}$/;
const DEFAULTS_DOC = "defaults";

const accountText = document.getElementById("accountText");
const accountBtn = document.getElementById("accountBtn");

let fs = null;          // Firestore SDK 함수 묶음
let db = null;
let stopListening = [];
let syncedJson = {};    // 서버와 맞춰진 내용. 바뀐 문서만 쓰고, 내가 쓴 내용의 되돌아옴을 무시하는 데 씀
let renderPending = false;

function setAccountText(text) {
  accountText.textContent = text;
}

function readSyncUid() {
  try { return localStorage.getItem(SYNC_UID_KEY); } catch (e) { return null; }
}

function writeSyncUid(uid) {
  try { localStorage.setItem(SYNC_UID_KEY, uid); } catch (e) { /* 다음 로그인 때 다시 합침 */ }
}

function dateKeys() {
  return Object.keys(data).filter((key) => DATE_KEY_PATTERN.test(key));
}

function defaultsJson() {
  return JSON.stringify({ items: data.items, subItems: data.subItems });
}

// 앱을 연 것만으로 자동 생성된 기록. 올리면 다른 기기에서 체크한 내용을 빈 기록으로 덮어쓰게 됨
function isUntouched(dateKey) {
  return JSON.stringify(data[dateKey]) === JSON.stringify(createDefaultEntry());
}

function writeDoc(ref, json) {
  fs.setDoc(ref, { value: json, updatedAt: fs.serverTimestamp() }).catch(() => {
    setAccountText("동기화 저장에 실패했어요");
  });
}

// 값은 JSON 문자열로 저장: Firestore는 맵 키를 정렬해 돌려줘서, 객체로 저장하면 루틴 순서가 뒤섞임
function pushChanges() {
  if (!userPath) return;
  dateKeys().forEach((key) => {
    const json = JSON.stringify(data[key]);
    if (syncedJson[key] === json) return;
    if (!(key in syncedJson) && isUntouched(key)) return;
    syncedJson[key] = json;
    writeDoc(fs.doc(db, userPath, "days", key), json);
  });
  const json = defaultsJson();
  if (syncedJson[DEFAULTS_DOC] !== json) {
    syncedJson[DEFAULTS_DOC] = json;
    writeDoc(fs.doc(db, userPath, "meta", DEFAULTS_DOC), json);
  }
}

// 글을 쓰는 중에 다시 그리면 커서와 키보드가 사라지므로 입력이 끝날 때까지 미룸.
// 빈 입력창에 커서만 있거나 다른 창을 보고 있으면 입력 중이 아니니 바로 그림
function renderAll() {
  const active = document.activeElement;
  if (document.hasFocus() && active && active.tagName === "INPUT" && active.type === "text" && active.value) {
    renderPending = true;
    return;
  }
  renderPending = false;
  renderCalendar();
  renderDayView(document.getElementById("todayView"), todayKey);
  if (!dayDetail.hidden) renderDayView(document.getElementById("detailView"), detailDateKey);
}

document.addEventListener("focusout", () => {
  // 포커스가 다른 입력창으로 옮겨 가는 중일 수 있어 이동이 끝난 뒤 판단
  setTimeout(() => { if (renderPending) renderAll(); }, 0);
});

function applyRemoteDefaults(json) {
  if (syncedJson[DEFAULTS_DOC] === json) return false;
  // 자동 생성된 오늘 기록은 예전 기본 루틴으로 만들어졌으니 새 기본 루틴으로 다시 만듦
  const rebuildToday = !(todayKey in syncedJson) && data[todayKey] && isUntouched(todayKey);
  const remote = JSON.parse(json);
  data.items = remote.items;
  data.subItems = remote.subItems;
  syncedJson[DEFAULTS_DOC] = json;
  if (rebuildToday) data[todayKey] = createDefaultEntry();
  return true;
}

function applyRemoteDay(key, json) {
  if (syncedJson[key] === json) return false;
  data[key] = JSON.parse(json);
  syncedJson[key] = json;
  return true;
}

// 기기에 있던 기록과 계정 기록이 같은 날짜에 둘 다 있으면 어느 쪽도 잃지 않게 합침
function mergeEntry(local, remote) {
  const merged = JSON.parse(JSON.stringify(remote));
  if (!merged.checks) merged.checks = {};
  if (!merged.subs) merged.subs = {};
  Object.keys(local.checks || {}).forEach((item) => {
    merged.checks[item] = !!merged.checks[item] || !!local.checks[item];
  });
  Object.keys(local.subs || {}).forEach((item) => {
    if (!merged.subs[item]) merged.subs[item] = {};
    Object.keys(local.subs[item]).forEach((sub) => {
      merged.subs[item][sub] = !!merged.subs[item][sub] || !!local.subs[item][sub];
    });
  });
  if (local.memo && local.memo !== merged.memo) {
    merged.memo = merged.memo ? merged.memo + " / " + local.memo : local.memo;
  }
  return merged;
}

// 이 기기에서 이 계정으로 처음 로그인할 때 한 번만 실행.
// 매번 합치면 다른 기기에서 지운 루틴이 되살아나므로, 이후에는 나중에 저장한 쪽이 이김
async function mergeLocalIntoAccount(path) {
  const [daySnap, defaultsSnap] = await Promise.all([
    fs.getDocs(fs.collection(db, path, "days")),
    fs.getDoc(fs.doc(db, path, "meta", DEFAULTS_DOC))
  ]);
  const remoteDays = {};
  daySnap.forEach((d) => { remoteDays[d.id] = d.data().value; });

  // 빈 기록을 가려내려면 합치기 전 기본 루틴이 필요하므로 먼저 판별
  const untouched = new Set(dateKeys().filter(isUntouched));

  if (defaultsSnap.exists()) {
    const remote = JSON.parse(defaultsSnap.data().value);
    const localItems = data.items;
    const localSubs = data.subItems;
    syncedJson[DEFAULTS_DOC] = defaultsSnap.data().value;
    data.items = remote.items.concat(localItems.filter((item) => !remote.items.includes(item)));
    data.subItems = remote.subItems;
    Object.keys(localSubs).forEach((item) => {
      const known = data.subItems[item] || [];
      data.subItems[item] = known.concat(localSubs[item].filter((sub) => !known.includes(sub)));
    });
  }

  untouched.forEach((key) => { delete data[key]; });
  Object.keys(remoteDays).forEach((key) => {
    const remote = JSON.parse(remoteDays[key]);
    syncedJson[key] = remoteDays[key];
    data[key] = data[key] ? mergeEntry(data[key], remote) : remote;
  });
  getEntry(todayKey);
}

function clearLocalData() {
  Object.keys(data).forEach((key) => { delete data[key]; });
  data.items = [];
  data.subItems = {};
}

async function startSync(user) {
  userPath = null;
  syncedJson = {};
  const path = "users/" + user.uid;
  setAccountText(user.email + " · 동기화 중");

  const savedUid = readSyncUid();
  if (savedUid && savedUid !== user.uid) clearLocalData();

  if (savedUid !== user.uid) {
    // 합치기가 실패하면 uid를 남기지 않아서 다음에 다시 시도함.
    // 합치는 동안의 저장이 계정 기록을 덮어쓰지 않도록 userPath는 끝난 뒤에 설정
    await mergeLocalIntoAccount(path);
    writeSyncUid(user.uid);
  } else {
    // 같은 계정이면 저장된 사본을 서버 기준으로 보고, 달라진 문서만 아래 구독에서 반영함
    dateKeys().forEach((key) => { syncedJson[key] = JSON.stringify(data[key]); });
    if (!data[todayKey] || isUntouched(todayKey)) delete syncedJson[todayKey];
    syncedJson[DEFAULTS_DOC] = defaultsJson();
  }

  userPath = path;
  saveData();
  renderAll();

  const onError = () => setAccountText(user.email + " · 동기화 오류");

  stopListening = [
    // 서버 확인만 끝나고 내용이 그대로일 때도 상태를 갱신하려고 메타데이터 변경까지 받음
    fs.onSnapshot(fs.collection(db, path, "days"), { includeMetadataChanges: true }, (snap) => {
      let changed = false;
      snap.docChanges().forEach((change) => {
        // 아직 서버에 안 올라간 내 쓰기는 이미 화면에 반영돼 있음
        if (change.type === "removed" || change.doc.metadata.hasPendingWrites) return;
        if (applyRemoteDay(change.doc.id, change.doc.data().value)) changed = true;
      });
      if (changed) { saveLocalOnly(); renderAll(); }
      let status = " · 동기화됨";
      if (snap.metadata.fromCache) status = " · 연결 기다리는 중";
      else if (snap.metadata.hasPendingWrites) status = " · 저장 중";
      setAccountText(user.email + status);
    }, onError),
    fs.onSnapshot(fs.doc(db, path, "meta", DEFAULTS_DOC), (snap) => {
      if (snap.exists() && !snap.metadata.hasPendingWrites && applyRemoteDefaults(snap.data().value)) {
        saveLocalOnly();
        renderAll();
      }
    }, onError)
  ];
}

function stopSync() {
  stopListening.forEach((stop) => stop());
  stopListening = [];
  userPath = null;
}

// 공용 기기에 기록이 남지 않도록 로그아웃하면 이 기기의 사본을 지움. 기록은 계정에 남아 있음
async function logOut(auth, signOut) {
  clearTimeout(memoTimer);
  saveData();
  const uploaded = await Promise.race([
    fs.waitForPendingWrites(db).then(() => true, () => false),
    new Promise((resolve) => setTimeout(() => resolve(false), 3000))
  ]);
  const message = uploaded
    ? "로그아웃하면 이 기기의 사본을 지워요. 기록은 계정에 남아 있어요."
    : "아직 올리지 못한 기록이 있어요. 지금 로그아웃하면 그 내용은 사라져요.";
  if (!confirm(message)) return;
  stopSync();
  await signOut(auth);
  await fs.terminate(db);
  await fs.clearIndexedDbPersistence(db).catch(() => {});
  try {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(SYNC_UID_KEY);
  } catch (e) {
    // 지우지 못해도 다음 로그인에서 uid를 비교해 처리됨
  }
  location.reload();
}

// SDK는 화면을 다 그린 뒤 불러옴: 네트워크가 안 돼도 이 기기 저장으로 앱은 계속 쓸 수 있음
async function initSync() {
  try {
    const [appSdk, authSdk, firestoreSdk] = await Promise.all([
      import(SDK_URL + "firebase-app.js"),
      import(SDK_URL + "firebase-auth.js"),
      import(SDK_URL + "firebase-firestore.js")
    ]);
    fs = firestoreSdk;
    const app = appSdk.initializeApp(firebaseConfig);
    const auth = authSdk.getAuth(app);
    // 오프라인에서 쓴 내용이 앱을 닫아도 남아 있다가 연결되면 올라가도록 기기에 보관
    db = fs.initializeFirestore(app, {
      localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() })
    });

    let currentUser = null;
    accountBtn.hidden = false;
    accountBtn.addEventListener("click", async () => {
      if (currentUser) {
        logOut(auth, authSdk.signOut);
        return;
      }
      try {
        // 리디렉션은 github.io처럼 authDomain과 다른 도메인에서 Safari 등이 막아서 팝업을 씀
        await authSdk.signInWithPopup(auth, new authSdk.GoogleAuthProvider());
      } catch (e) {
        if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
          setAccountText(e.code === "auth/popup-blocked" ? "팝업이 막혀서 로그인하지 못했어요" : "로그인하지 못했어요");
        }
      }
    });

    authSdk.onAuthStateChanged(auth, async (user) => {
      stopSync();
      currentUser = user;
      accountBtn.textContent = user ? "로그아웃" : "구글 로그인";
      if (!user) {
        setAccountText("이 기기에만 저장 중 · 로그인하면 폰과 웹이 동기화돼요");
        return;
      }
      try {
        await startSync(user);
      } catch (e) {
        userPath = null;
        setAccountText(user.email + " · 동기화 오류");
      }
    });
  } catch (e) {
    setAccountText("이 기기에만 저장 중 · 동기화를 불러오지 못했어요");
  }
}

initSync();
</script>
