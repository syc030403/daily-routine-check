<!DOCTYPE html>
<!--
  데일리 루틴 체크 앱
  의도: 달력으로 날짜별 루틴을 관리하고, 옆으로 넘기면 오늘 루틴을 바로 체크하는 개인용 앱.
       메뉴/저장 버튼 없이 바로 쓸 수 있어야 해서,
       빌드 도구 없이 브라우저가 바로 실행하는 파일(style.css, js/)로만 구성함.
       로그인은 선택: 안 하면 이 기기에만 저장되고, 구글 로그인하면 폰과 웹이 동기화됨.
       체크 항목은 코드에 박아두지 않고 사용자가 처음부터 직접 추가하는 방식.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데일리 루틴</title>
<!-- 전부 상대 경로: GitHub Pages 하위 경로(/저장소이름/)에서도 그대로 동작하도록 -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#2e7d32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="루틴">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="pager" id="pager">
  <section class="page" aria-label="달력">
    <div class="wrap">
      <div class="month-header">
        <button type="button" class="month-btn" id="prevMonth" aria-label="이전 달">‹</button>
        <h1 class="month-title" id="monthTitle"></h1>
        <button type="button" class="month-btn" id="nextMonth" aria-label="다음 달">›</button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="account-bar">
        <span class="account-text" id="accountText">이 기기에만 저장 중</span>
        <button type="button" class="account-btn" id="accountBtn" hidden>구글 로그인</button>
      </div>
    </div>
  </section>
  <section class="page" aria-label="오늘 루틴">
    <div class="wrap" id="todayView"></div>
  </section>
</main>
<nav class="tabs">
  <button type="button" class="tab active" id="calendarTab">달력</button>
  <button type="button" class="tab" id="todayTab">오늘</button>
</nav>
<div class="day-detail" id="dayDetail" hidden>
  <div class="wrap">
    <button type="button" class="back-btn" id="backBtn">‹ 달력</button>
    <div id="detailView"></div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
